<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>向阳花圃 · 陪你把生活一点点养回来</title>
    <meta name="description" content="向阳花圃：帮抑郁的人管理生活的小工具 —— 记录心情、按时吃药、专注做事，一天天把日子养回来。" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <!--
      apple- 那个是给旧 iOS 用的，Chrome 会警告它已废弃；
      mobile-web-app-capable 是标准写法。两个都留着：
      iOS 16 之前只认前者，新浏览器认后者。警告本身不影响功能。
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="向阳花圃" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <script>
      // 在首屏绘制前定好主题，避免闪白
      (function () {
        try {
          var t = localStorage.getItem('shiguang.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
